name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: JhonathanOliveiraa/tcc-pipeline-templates/.github/workflows/backend-service.yml@main
    with:
      platform-repository: JhonathanOliveiraa/tcc-platform
      overlay-path: apps/catalogo-api/hml
      dotnet-version: "10.0.x"
      test-command: ""   # EXPERIMENTO: defeito que escapa aos testes
      # test-command padrão: dotnet test --configuration Release (unidade + integração com Testcontainers)
      enable-deploy: ${{ github.event_name != 'pull_request' }}
    secrets:
      platform-token: ${{ secrets.PLATFORM_REPO_TOKEN }}
